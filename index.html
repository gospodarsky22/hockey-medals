<style>
:root{
  --bg:#EFF3F8;--card:#FFF;--sink:#F1F5FA;--ink:#0B1B2E;--ink2:#4A5F77;--ink3:#8496A9;--hair:#DCE5EE;
  --navy:#0B1B2E;--navy2:#16324F;--accent:#2563EB;--accent-soft:#E6EDFD;
  --gold:#D4A017;--gold2:#FBEFC9;--silver:#8E9DAB;--silver2:#EDF1F5;
  --bronze:#B06B37;--bronze2:#F7E7D8;--plat:#1E9BB8;--plat2:#DDF2F7;
  --legend:#8B3FBF;--legend2:#F0E3FA;--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070E17;--card:#101E2E;--sink:#0C1826;--ink:#E9F1F8;--ink2:#A5B7C8;--ink3:#6C8095;
  --hair:#1D2F43;--navy:#050B13;--navy2:#0F2136;--accent:#5B8DEF;--accent-soft:#152945;
  --gold2:#33280C;--silver2:#1B2937;--bronze2:#33210F;--plat2:#0D2C35;--legend2:#2A1440;}}
:root[data-theme="dark"]{
  --bg:#070E17;--card:#101E2E;--sink:#0C1826;--ink:#E9F1F8;--ink2:#A5B7C8;--ink3:#6C8095;
  --hair:#1D2F43;--navy:#050B13;--navy2:#0F2136;--accent:#5B8DEF;--accent-soft:#152945;
  --gold2:#33280C;--silver2:#1B2937;--bronze2:#33210F;--plat2:#0D2C35;--legend2:#2A1440;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.n{font-family:"Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
.app{width:100%;max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;touch-action:manipulation}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#EAF2FB}
.top-in{max-width:1180px;margin:0 auto;padding:11px 16px 12px}
.trow{display:flex;align-items:center;gap:10px;min-height:34px}
.back{appearance:none;border:0;background:rgba(255,255,255,.12);border-radius:9px;width:32px;height:32px;
  cursor:pointer;font-size:17px;color:#fff;display:none;place-items:center;flex:0 0 auto}
.back.on{display:grid}.back:active{background:rgba(255,255,255,.26)}
.ttl{font-family:"Barlow Condensed";font-size:23px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#7C93AC;margin:2px 0 0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--hair);background:var(--card);border-radius:999px;padding:7px 14px;
  font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:active{opacity:.75}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips.sub2 .chip{padding:6px 12px;font-size:12.5px;font-weight:500}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;padding:16px;padding-bottom:94px}
.h{font-family:"Barlow Condensed";font-size:20px;margin:24px 0 10px}.h:first-child{margin-top:0}
.muted{color:var(--ink3);font-size:12.5px}
.srch{width:100%;padding:12px 15px;border:1px solid var(--hair);border-radius:11px;background:var(--card);
  color:var(--ink);font:400 15px Inter;margin-bottom:12px}
.srch:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.list{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.r{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--hair);
  cursor:pointer;background:transparent;width:100%;text-align:left}
.list .r:first-child{border-top:0}
.r:hover{background:var(--sink)}.r:active{background:var(--accent-soft)}
.pos{flex:0 0 28px;height:28px;border-radius:8px;font-family:"Barlow Condensed";font-size:15px;color:var(--ink3);
  display:grid;place-items:center;background:var(--sink)}
.pos.p1{background:var(--gold);color:#fff}.pos.p2{background:var(--silver);color:#fff}.pos.p3{background:var(--bronze);color:#fff}
.av{flex:0 0 36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:18px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.val{font-family:"Barlow Condensed";font-size:21px;text-align:right;min-width:54px}
.val em{display:block;font:500 10.5px Inter;color:var(--ink3);font-style:normal;margin-top:-3px}
.me{background:var(--accent-soft)}
.hero{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#EAF2FB;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%)}
.hero .ghost{position:absolute;right:-6px;top:-26px;font-family:"Barlow Condensed";font-size:150px;
  color:rgba(255,255,255,.07);line-height:1;pointer-events:none}
.hero h1{margin:0;font-family:"Barlow Condensed";font-size:32px;font-weight:600;line-height:1.05;position:relative}
.hero p{margin:6px 0 0;font-size:13.5px;color:#A9C0D8;position:relative}
.lvl{display:flex;align-items:center;gap:12px;margin-top:14px;position:relative}
.lvlbadge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(140deg,var(--gold),#A97C10);color:#fff;font-family:"Barlow Condensed";line-height:1}
.lvlbadge b{font-size:24px}.lvlbadge span{font-size:9px;letter-spacing:.5px}
.lvlbar{flex:1;min-width:0}
.lvlbar .t{display:flex;justify-content:space-between;font-size:11.5px;color:#A9C0D8;margin-bottom:5px}
.lvlbar .track{height:8px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden}
.lvlbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F2C94C)}
.platinum{margin-top:12px;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;
  border:1px solid var(--plat);background:var(--plat2)}
.platinum.locked{border-color:var(--hair);background:var(--card);opacity:.75}
.platinum .pi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;
  background:#fff;border:2px solid var(--plat);flex:0 0 auto}
.platinum.locked .pi{border-color:var(--hair)}
.platinum b{display:block;font-size:15px}.platinum span{font-size:12.5px;color:var(--ink2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.box{background:var(--card);border:1px solid var(--hair);border-radius:11px;padding:11px 13px}
.box b{display:block;font-family:"Barlow Condensed";font-size:25px;line-height:1.05}
.box span{font-size:11.5px;color:var(--ink3)}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.tbl div{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:9px 11px}
.tbl b{display:block;font-family:"Barlow Condensed";font-size:18px}
.tbl span{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.med{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:14px 8px 11px;text-align:center;
  cursor:pointer;position:relative}
.med:hover{border-color:var(--accent)}.med:active{background:var(--sink)}
.med.off{opacity:.42}.med.na{opacity:.3}
.disc{width:48px;height:48px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;font-size:21px;
  background:var(--sink);border:2px solid var(--hair)}
.d1{background:var(--bronze2);border-color:var(--bronze);box-shadow:0 0 0 3px var(--bronze2)}
.d2{background:var(--silver2);border-color:var(--silver);box-shadow:0 0 0 3px var(--silver2)}
.d3{background:var(--gold2);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold2)}
.d4{background:var(--plat2);border-color:var(--plat);box-shadow:0 0 0 3px var(--plat2)}

.mt.on{color:var(--gold)}
.rar{display:block;font-size:9.5px;font-weight:700;margin-top:3px}
.rc0{color:var(--ink3)}.rc1{color:var(--accent)}.rc2{color:var(--plat)}.rc3{color:var(--gold)}.rc4{color:var(--legend)}

.lock{position:absolute;top:8px;right:9px;font-size:10px}
.note{background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--accent);border-radius:10px;

.note.warn{border-left-color:var(--gold)}
.disclose{margin-bottom:16px}
.disclose summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--accent);padding:8px 3px;user-select:none}
.disclose summary::-webkit-details-marker{display:none}
.disclose summary::before{content:"ⓘ"}.disclose[open] summary::before{content:"ⓧ"}

.step{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--hair)}
.list .step:first-child{border-top:0}
.step.done{background:var(--sink)}
.sd{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  border:2px solid var(--hair);background:var(--sink)}
.sx{flex:1;min-width:0}.sx b{display:block;font-size:14px}.sx span{font-size:12px;color:var(--ink3)}
.bar{height:6px;border-radius:4px;background:var(--sink);overflow:hidden;margin-top:8px;border:1px solid var(--hair)}
.bar i{display:block;height:100%;background:var(--accent)}
.rtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
.rb0{background:var(--sink);color:var(--ink3)}.rb1{background:var(--accent-soft);color:var(--accent)}
.rb2{background:var(--plat2);color:var(--plat)}.rb3{background:var(--gold2);color:var(--gold)}
.rb4{background:var(--legend2);color:var(--legend)}

  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;appearance:none;border:0;background:transparent;padding:10px 4px 12px;cursor:pointer;

.tab[aria-pressed="true"]{color:var(--accent)}.tab:active{background:var(--sink)}

  .split{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  .grid4{grid-template-columns:repeat(2,1fr)}}

   браузер) tg будет undefined, весь блок просто не выполнится. */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  document.documentElement.style.setProperty('--tg-bg', tg.themeParams.bg_color || '');
  tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color');
}

// Раньше число задавалось вручную и отставало от реальности.
// Регламент Экстралиги: регулярка — 52 матча на команду (4 круга).
// rounds = максимум сыгранных матчей среди команд, считается по календарю.
const SEASON={
  get rounds(){
    const c={};
    MATCHES.filter(m=>m.hs!==undefined).forEach(m=>{c[m.home]=(c[m.home]||0)+1;c[m.away]=(c[m.away]||0)+1;});
    return Math.max(0,...Object.values(c));
  },
  total:52
};

/* ===== турнирная таблица =====
   Двухочковая система (как в КХЛ/НХЛ): любая победа — 2 очка,
   поражение в овертайме или по буллитам — 1, поражение в основное — 0. */
function standings(){
  const t={};
  const row=n=>t[n]||(t[n]={team:n,gp:0,w:0,wo:0,wb:0,l:0,lo:0,lb:0,gf:0,ga:0,pts:0});
  MATCHES.filter(m=>m.hs!==undefined).forEach(m=>{
    const H=row(m.home), A=row(m.away);
    H.gp++; A.gp++;
    H.gf+=m.hs; H.ga+=m.as; A.gf+=m.as; A.ga+=m.hs;
    const homeWon=m.hs>m.as;
    const W=homeWon?H:A, L=homeWon?A:H;
    if(m.ot==='so'){ W.wb++; W.pts+=2; L.lb++; L.pts+=1; }
    else if(m.ot==='ot'){ W.wo++; W.pts+=2; L.lo++; L.pts+=1; }
    else { W.w++; W.pts+=2; L.l++; }
  });
  return Object.values(t).sort((a,b)=>
    b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf || a.team.localeCompare(b.team));
}

const RANKS={},PROG={};
function rankIn(p,a){
  if(!RANKS[a.id]){
    let arr=a.role==='gk'?goalies():skaters();
    if(a.only)arr=arr.filter(x=>x.pos===a.only);
    const m={};
    arr.slice().sort((x,y)=>a.inv?x[a.rank]-y[a.rank]:y[a.rank]-x[a.rank]).forEach((q,i)=>m[q.id]=i+1);
    RANKS[a.id]=m;
  }
  return RANKS[a.id][p.id]||null;
}
function prog(p,a){
  if(a.needsProto)return{v:null,tier:0,nx:null,na:1,pct:0};
  const key=p.id+'|'+a.id;if(PROG[key])return PROG[key];
  let out;
  if(a.m==='rank'){
    const raw=p[a.rank]||0;
    if(!raw){out={v:null,tier:0,nx:a.t[0],rank:1,pct:0};}
    else{
      const r=rankIn(p,a);
      let tier=0;a.t.forEach(t=>{if(r&&r<=t[1])tier=t[0]});
      const nx=a.t.find(t=>t[0]>tier);
      out={v:r,tier,nx,rank:1,pct:nx&&r?Math.max(0,Math.min(1,(a.t[0][1]-r+1)/(a.t[0][1]-nx[1]+1))):0};
    }
  }else{
    const v=a.f(p);let tier=0;
    a.t.forEach(t=>{if(a.inv?(v<=t[1]&&v>0):v>=t[1])tier=t[0]});
    const nx=a.t.find(t=>t[0]>tier);
    const from=tier?a.t.find(t=>t[0]===tier)[1]:(a.inv?(a.base||4):0);
    out={v,tier,nx,rank:0,
      pct:nx?Math.max(0,Math.min(1,a.inv?(from-v)/(from-nx[1]):(v-from)/(nx[1]-from))):1};
  }
  // Сезон не доигран — место/итоговый процент показываем как предварительные,
  // но уровень не присваиваем и очки не начисляем.
  if(locked(a)) out={...out,tier:0,pending:1};
  // Вратарский ценз: без трети матчей команды медаль не считается даже в конце сезона
  if(a.role==='gk'&&(a.id==='fortress'||a.id==='gaa')&&!gkQualified(p)) out={...out,tier:0,pending:1};
  return PROG[key]=out;
}
const RARITY={};
CAT.forEach(a=>{
  if(!counts(a)||locked(a)){RARITY[a.id]=null;return;}
  const pool=DB.filter(p=>eligible(p,a));
  RARITY[a.id]=pool.length?pool.filter(p=>prog(p,a).tier>0).length/pool.length*100:0;
});

function rarityOf(id){
  const pc=RARITY[id];if(pc===null)return null;
  for(const[min,name,cls]of RAR_LABEL)if(pc>=min)return{pc,name,cls};
  return{pc,name:'Легендарная',cls:4};
}
const medalPoints=p=>CAT.filter(a=>eligible(p,a)&&counts(a))
  .reduce((s,a)=>s+(prog(p,a).tier?TIER_PTS[prog(p,a).tier]:0),0);
function collection(p){
  const list=CAT.filter(a=>eligible(p,a)&&counts(a));
  const got=list.filter(a=>prog(p,a).tier>0).length;
  return{got,total:list.length,pct:list.length?got/list.length*100:0};
}
const LEVELS=[0,40,100,180,290,430,610,830,1100,1430];
function levelOf(pts){
  let lv=1;LEVELS.forEach((th,i)=>{if(pts>=th)lv=i+1});
  const cur=LEVELS[lv-1]??0,next=LEVELS[lv]??null;
  return{lv,cur,next,pct:next?(pts-cur)/(next-cur):1};
}

const played=m=>m.hs!==undefined;
const winnerOf=m=>played(m)?(m.hs>m.as?'home':'away'):null;

function head(){
  const p=S.pid?findP(S.pid):null,a=S.aid?ach(S.aid):null;
  $('#ttl').textContent=S.view==='rank'?'Рейтинг':S.view==='league'?'Лига':S.view==='medals'?'Медали':S.view==='me'?'Профиль'
    :S.view==='player'?(p?p.name:'Игрок'):(a?(a.secret&&p&&!prog(p,a).tier?'Скрытая медаль':a.n):'Медаль');
  $('#back').className='back'+(S.view==='player'||S.view==='medal'?' on':'');
  document.querySelectorAll('#tabs .tab').forEach(b=>b.setAttribute('aria-pressed',S.tab===b.dataset.tab));
}
function body(){
  $('#main').innerHTML=S.view==='rank'?vRank():S.view==='league'?vLeague():S.view==='medals'?vCat():S.view==='me'?vMe()
    :S.view==='player'?vPlayer():vMedal();
}
function draw(){head();body()}
function go(v,o={}){S.sc[k()]=scrollY;Object.assign(S,{view:v},o);draw();scrollTo(0,0)}
function back(){
  S.sc[k()]=scrollY;
  if(S.view==='medal')S.view=S.pid?(S.pid===ME&&S.tab==='me'?'me':'player'):'medals';
  else if(S.view==='player')S.view=S.tab==='medals'?'medals':S.tab==='me'?'me':'rank';
  draw();const y=S.sc[k()]||0;requestAnimationFrame(()=>scrollTo(0,y));
}

    .filter(p=>m.f(p)!==null).sort((x,y)=>m.asc?m.f(x)-m.f(y):m.f(y)-m.f(x));
  if(!pool.length)return `<div class="note">Никто не подошёл под фильтр.</div>`;

function vPlayer(){const p=findP(S.pid);return p?card(p):`<div class="note">Игрок не найден.</div>`}
function card(p,extra){

  const quick=p.pos==='Вратарь'
    ?[['Матчи',p.gp],['Победы',p.wins],['% ОБ',p.sv===null?'—':p.sv+(p.est?'*':'')],['КН',p.gaa]]
    :[['Матчи',p.gp],['Голы',p.g],['Передачи',p.a],['Очки',p.pts]];

    ?[['Сухие матчи',p.so],...(p.year?[['Год рождения',p.year]]:[])]
    :[['+/-',(p.pm>0?'+':'')+p.pm],['Штраф',p.pim],['Броски',p.shots],['Реализация',p.shotPct+'%'],
      ['Больш. (О)',p.ppg+p.ppa],['Меньш. (О)',p.shg+p.sha],...(p.year?[['Год рождения',p.year]]:[])];
  return `<div class="split"><div>
    <div class="hero"><span class="ghost n">${p.pos==='Вратарь'?'🥅':(p.pts||'🏒')}</span>
      <h1>${esc(p.name)}</h1><p>${esc(p.team)} · ${p.pos}</p>
      <div class="lvl"><div class="lvlbadge"><b class="n">${lv.lv}</b><span>УРОВЕНЬ</span></div>
        <div class="lvlbar"><div class="t"><span>${mp} очков медалей</span>
          <span>${lv.next?('до ур. '+(lv.lv+1)+': '+(lv.next-mp)):'максимум'}</span></div>
          <div class="track"><i style="width:${Math.round(lv.pct*100)}%"></i></div></div></div></div>
    <div class="platinum${plat?'':' locked'}"><span class="pi">${plat?'💎':'🔒'}</span>
      <span><b>${plat?'Платина получена':'Платина'}</b>
      <span>${plat?'Собраны все доступные медали':'Собрать все '+c.total+'. Сейчас '+c.got+' — '+Math.round(c.pct)+'%'}</span></span></div>
    <div class="grid4">${quick.map(([n,v])=>`<div class="box"><b class="n">${v}</b><span>${n}</span></div>`).join('')}</div>
    <div class="tbl">${rest.map(([n,v])=>`<div><b class="n">${v}</b><span>${n}</span></div>`).join('')}</div>
    ${p.pos==='Вратарь'&&p.est?`<p class="muted" style="margin-top:8px">* В ${p.est} матч${p.est===1?'е':'ах'} была замена вратаря внутри периода — броски и голы того периода разделены пропорционально времени на льду, а не взяты из протокола напрямую.</p>`:''}
    ${extra||''}</div>
   <div><div class="h">Медальный шкаф · ${c.got} из ${c.total}</div>
    <div class="wall">${CAT.filter(a=>eligible(p,a)).map(a=>tile(p,a)).join('')}</div></div></div>`;
}
function tile(p,a){
  const pr=prog(p,a),rar=rarityOf(a.id);
  if(pr.na)return `<button class="med na" data-a="${a.id}" data-owner="${p.id}">
    <span class="disc">${a.i}</span><span class="mn">${esc(a.n)}</span>
    <span class="mt">нет данных</span></button>`;
  const hidden=a.secret&&!pr.tier;
  const t=pr.tier?a.t.find(x=>x[0]===pr.tier):null;
  const val=pr.rank?(pr.v?'#'+pr.v:'—'):(pr.v??'—');
  const sub=pr.tier?'★'.repeat(pr.tier)
    :pr.pending?val
    :pr.nx?(pr.rank?val:pr.v+' / '+pr.nx[1]):'—';
  const foot=hidden?''
    :pr.pending?`<span class="rar rc0">по итогам сезона</span>`
    :rar?`<span class="rar rc${rar.cls}">${rar.name} · ${rar.pc.toFixed(1)}%</span>`:'';
  return `<button class="med${pr.tier?'':' off'}" data-a="${a.id}" data-owner="${p.id}">
   <span class="pts">${pr.tier?TIER_PTS[pr.tier]:''}</span>${hidden?'<span class="lock">🔒</span>':pr.pending?'<span class="lock">⏳</span>':''}
   <span class="disc${pr.tier?' d'+pr.tier:''}">${hidden?'❓':a.i}</span>
   <span class="mn">${hidden?'Скрытая медаль':esc(t?t[2]:a.n)}</span>
   <span class="mt${pr.tier?' on':''}">${hidden?'':sub}</span>
   ${foot}</button>`;
}
function roleSwitch(){
  return `<div class="chips sub2" style="margin-bottom:14px">
    <button class="chip" aria-pressed="${S.role==='player'}" data-role="player">🏒 Игрок</button>
    <button class="chip" aria-pressed="${S.role==='fan'}" data-role="fan">📣 Болельщик</button></div>`;
}
function vMe(){
  if(S.role==='fan')return roleSwitch()+vFan();
  const p=findP(ME);
  const near=CAT.filter(a=>eligible(p,a)&&counts(a)&&!a.secret).map(a=>({a,pr:prog(p,a)}))
    .filter(o=>o.pr.nx&&o.a.m!=='rank'&&!o.pr.pending).sort((x,y)=>y.pr.pct-x.pr.pct).slice(0,3);
  const goals=near.length?`<div class="h">Ближайшие цели</div><div class="list">${near.map(o=>{
    const t=o.pr.nx;
    return `<div class="step"><span class="sd">${o.a.i}</span><span class="sx"><b>${esc(t[2])}</b>
      <span>${o.pr.v} из ${t[1]} — осталось ${Math.round((t[1]-o.pr.v)*10)/10} ${esc(o.a.u)} · +${TIER_PTS[t[0]]} очков</span>
      <span class="bar"><i style="width:${Math.round(o.pr.pct*100)}%"></i></span></span></div>`;}).join('')}</div>`:'';
  return roleSwitch()+card(p,goals);
}

/* ===== профиль болельщика ===== */
function predScore(){
  let right=0,total=0;
  MATCHES.filter(played).forEach(m=>{
    const p=S.preds[m.id]; if(!p)return;
    total++; if(p===winnerOf(m))right++;
  });
  return {right,total,pts:right*3};
}
function vFan(){
  if(!S.fav)return `<div class="note">Выберите клуб, за который болеете — приложение подстроится под него.</div>
    <div class="chips" style="flex-wrap:wrap;gap:8px">${CLUBS.map(c=>
      `<button class="chip" data-fav="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;

  const team=S.fav, sc=predScore();
  const mine=MATCHES.filter(m=>m.home===team||m.away===team);
  const last=mine.filter(played).slice(-1)[0];
  const next=mine.filter(m=>!played(m))[0];
  const roster=skaters().filter(p=>p.team===team);
  const topSc=roster.slice().sort((a,b)=>b.pts-a.pts||b.g-a.g)[0];
  // кто ближе всех к следующей медали
  const close=roster.map(p=>{
    const best=CAT.filter(a=>eligible(p,a)&&counts(a)&&!a.secret&&!prog(p,a).pending)
      .map(a=>({a,pr:prog(p,a)})).filter(o=>o.pr.nx)
      .sort((x,y)=>y.pr.pct-x.pr.pct)[0];
    return best?{p,...best}:null;
  }).filter(Boolean).sort((x,y)=>y.pr.pct-x.pr.pct).slice(0,3);

  const upcoming=MATCHES.filter(m=>!played(m));
  const resolved=MATCHES.filter(m=>played(m)&&S.preds[m.id]);

  return `<div class="hero"><span class="ghost n">📣</span>
      <h1>${esc(team)}</h1><p>Ваш клуб · сезон 2026/27</p>
      <span class="pill">🎯 Прогнозы: ${sc.pts} очк. · угадано ${sc.right} из ${sc.total}</span></div>

    <div class="grid4" style="grid-template-columns:repeat(2,1fr)">
      <div class="box"><b class="n">${last?`${last.home===team?last.hs:last.as}:${last.home===team?last.as:last.hs}`:'—'}</b>
        <span>${last?'с «'+esc(last.home===team?last.away:last.home)+'»':'матчей ещё не было'}</span></div>
      <div class="box"><b class="n" style="font-size:16px">${next?esc(next.d):'—'}</b>
        <span>${next?'с «'+esc(next.home===team?next.away:next.home)+'» в '+next.t:'календарь пуст'}</span></div>
    </div>

    <div class="h">Прогнозы на ближайшие матчи</div>
    <div class="note">Выберите победителя. За угаданный исход — 3 очка. Результаты подводятся,
      когда в приложение попадает протокол матча.</div>
    <div class="list">${upcoming.map(m=>{
      const p=S.preds[m.id];
      return `<div class="step"><span class="sx">
        <b>${esc(m.home)} — ${esc(m.away)}</b><span>${esc(m.d)} · ${m.t}</span></span>
        <span style="display:flex;gap:6px;flex:0 0 auto">
          <button class="chip" aria-pressed="${p==='home'}" data-pred="${m.id}" data-side="home">П1</button>
          <button class="chip" aria-pressed="${p==='away'}" data-pred="${m.id}" data-side="away">П2</button>
        </span></div>`;}).join('')}</div>

    ${resolved.length?`<div class="h">Сыгранные прогнозы</div><div class="list">${resolved.map(m=>{
      const ok=S.preds[m.id]===winnerOf(m);
      return `<div class="step${ok?' done':''}"><span class="sd">${ok?'✓':'✗'}</span>
        <span class="sx"><b>${esc(m.home)} ${m.hs}:${m.as} ${esc(m.away)}</b>
        <span>ваш прогноз: ${S.preds[m.id]==='home'?esc(m.home):esc(m.away)} · ${ok?'+3 очка':'0'}</span></span></div>`;
      }).join('')}</div>`:''}

    <div class="h">Лидер клуба</div>
    ${topSc?`<div class="list"><button class="r" data-p="${topSc.id}">
      <span class="av">🏒</span><span class="who"><b>${esc(topSc.name)}</b>
      <span>${topSc.g} г. + ${topSc.a} п. за ${topSc.gp} матч.</span></span>
      <span class="val n">${topSc.pts}<em>О</em></span></button></div>`
     :`<div class="note">У клуба пока нет сыгранных матчей.</div>`}

    ${close.length?`<div class="h">Ближе всех к медали</div><div class="list">${close.map(o=>
      `<button class="r" data-p="${o.p.id}"><span class="av">${o.a.i}</span>
        <span class="who"><b>${esc(o.p.name)}</b><span>${esc(o.pr.nx[2])} — ${o.pr.v} из ${o.pr.nx[1]}</span></span>
        <span class="val n">${Math.round(o.pr.pct*100)}<em>%</em></span></button>`).join('')}</div>`:''}

    <p class="muted" style="margin-top:16px">
      <button class="chip" data-fav="">Сменить клуб</button></p>`;
}
function vMedal(){
  const a=ach(S.aid),p=S.pid?findP(S.pid):null,rar=rarityOf(a.id);
  if(a.needsProto)return `<div class="note warn"><b>${esc(a.d)}.</b><br>
    Эта медаль считается по протоколам матчей. В таблице «Бомбардиры» только суммы за сезон,
    поэтому здесь данных нет — она появится, когда подключим разбор протоколов.</div>`;
  const pr=p?prog(p,a):null, hidden=a.secret&&pr&&!pr.tier;
  let out=`<div class="note">${hidden?'<b>Условие скрыто.</b> Медаль откроется сама, когда выполнится.'
      :'<b>'+esc(a.d)+'.</b>'}
    ${rar?`<span class="rtag rb${rar.cls}">${rar.name} · ${rar.pc.toFixed(1)}%</span>`
        :'<span class="rtag rb0">подводится по итогам сезона</span>'}</div>
   <details class="disclose"><summary>Как считается</summary>
    <div class="howto">${esc(MODE[a.m])} Медаль остаётся навсегда, даже если показатель потом упадёт.
     Очки за уровни: ${a.t.map(t=>TIER_PTS[t[0]]).join(' / ')}.</div></details>`;
  if(p&&!hidden){
    out+=`<div class="h">${esc(p.name)}</div><div class="list">${a.t.map(t=>{
      const done=pr.tier>=t[0],nx=pr.nx&&pr.nx[0]===t[0];
      return `<div class="step${done?' done':''}"><span class="sd${done?' d'+t[0]:''}">${done?'✓':t[0]}</span>
        <span class="sx"><b>${esc(t[2])}</b><span>${a.m==='rank'?'место '+t[1]+' или выше'
          :(a.inv?'не выше ':'нужно ')+t[1]+' '+esc(a.u)} · +${TIER_PTS[t[0]]} очков</span>
        ${nx?`<span class="bar"><i style="width:${Math.round(pr.pct*100)}%"></i></span>`:''}</span>
        <span class="val n">${a.m==='rank'?(pr.v?'#'+pr.v:'—'):pr.v}</span></div>`;}).join('')}</div>`;
  }
  const hs=DB.filter(x=>eligible(x,a)).map(x=>({p:x,pr:prog(x,a)})).filter(o=>o.pr.tier)
    .sort((x,y)=>y.pr.tier-x.pr.tier||(a.m==='rank'?x.pr.v-y.pr.v:(a.inv?x.pr.v-y.pr.v:y.pr.v-x.pr.v))).slice(0,15);
  out+=`<div class="h">Кто получил</div>`;
  out+=hs.length?`<div class="list">${hs.map((o,i)=>
    `<button class="r${o.p.id===ME?' me':''}" data-p="${o.p.id}"><span class="pos">${i+1}</span>
      <span class="who"><b>${esc(o.p.name)}</b><span>${esc(o.p.team)} · ${'★'.repeat(o.pr.tier)}</span></span>
      <span class="val n">${a.m==='rank'?'#'+o.pr.v:o.pr.v}</span></button>`).join('')}</div>`
   :`<div class="note">Эту медаль пока никто не получил.</div>`;
  return out;
}

       <span style="width:24px;text-align:right">О</span></span></div>
   ${tbl.map((r,i)=>`<button class="r${r.team===myTeam?' me':''}" data-team="${esc(r.team)}">
     <span class="pos${i<6?' p'+Math.min(i+1,3):''}">${i+1}</span>
     <span class="who"><b>${esc(r.team)}</b>
       <span>${r.w} побед · ${r.wo+r.wb} в ОТ/бул · ${r.lo+r.lb} пораж. в ОТ/бул · ${r.l} пораж.</span></span>
     <span style="display:flex;gap:10px;align-items:center;font-family:'Barlow Condensed';font-weight:700">
       <span style="width:18px;text-align:right;color:var(--ink3);font-size:15px">${r.gp}</span>
       <span style="width:26px;text-align:right;color:var(--ink3);font-size:15px">${r.gf}:${r.ga}</span>
       <span style="width:24px;text-align:right;font-size:19px">${r.pts}</span></span></button>`).join('')}</div>
   <p class="muted" style="margin-top:8px">Двухочковая система: победа — 2 очка, поражение в овертайме или по буллитам — 1.
     Первые шесть мест дают прямой выход в четвертьфинал.</p>`;

  // матчи по дням, свежие сверху; матчи своего клуба выделены
  const byDay={};
  MATCHES.filter(m=>m.hs!==undefined).forEach(m=>(byDay[m.d]=byDay[m.d]||[]).push(m));
  const days=Object.keys(byDay).reverse();
  const matches=`<div class="h">Матчи</div>${days.map(d=>`
    <div class="muted" style="margin:14px 0 6px;font-weight:600">${esc(d)}</div>
    <div class="list">${byDay[d].map(m=>{
      const mine=m.home===myTeam||m.away===myTeam;
      const hw=m.hs>m.as;
      const mark=m.ot==='so'?'<span class="rtag rb1">бул</span>':m.ot==='ot'?'<span class="rtag rb2">ОТ</span>':'';
      return `<div class="r${mine?' me':''}" style="cursor:default">
        <span class="who"><b>${esc(m.home)} — ${esc(m.away)}${mark}</b>
          <span>${mine?'матч вашего клуба':'&nbsp;'}</span></span>
        <span class="val n" style="min-width:64px">
          <span style="${hw?'':'color:var(--ink3)'}">${m.hs}</span>:<span style="${hw?'color:var(--ink3)':''}">${m.as}</span></span></div>`;
    }).join('')}</div>`).join('')}`;

  return head+table+matches;
}
function vCat(){
  const me=findP(ME),c=collection(me),mp=medalPoints(me),lv=levelOf(mp);
  const rows=a=>{
    const rar=rarityOf(a.id),mine=eligible(me,a)?prog(me,a):null;
    if(a.needsProto)return `<button class="r" data-a="${a.id}"><span class="av">${a.i}</span>
      <span class="who"><b>${esc(a.n)}</b><span>Нужны протоколы матчей</span></span>
      <span class="val n">—<em>нет данных</em></span></button>`;
    const hidden=a.secret&&(!mine||!mine.tier);
    const right=mine&&mine.tier?'★'.repeat(mine.tier)
      :mine&&mine.nx&&!hidden?(a.m==='rank'?(mine.v?'#'+mine.v:'—'):mine.v+'/'+mine.nx[1]):'—';
    return `<button class="r" data-a="${a.id}"><span class="av">${hidden?'❓':a.i}</span>
     <span class="who"><b>${hidden?'Скрытая медаль':esc(a.n)}${rar?`<span class="rtag rb${rar.cls}">${rar.pc.toFixed(1)}%</span>`:'<span class="rtag rb0">итог сезона</span>'}</b>
       <span>${hidden?'Откроется при выполнении':esc(a.short)}</span></span>
     <span class="val n">${right}<em>${mine&&mine.tier?'у вас':'прогресс'}</em></span></button>`;
  };
  return `<div class="note">Собрано <b>${c.got} из ${c.total}</b> · ${mp} очков · уровень ${lv.lv}.
   Процент — доля игроков лиги, у которых медаль уже есть: чем меньше, тем ценнее.</div>
   ${GROUPS.map(g=>{
     const items=CAT.filter(a=>a.group===g.id&&eligible(me,a));
     if(!items.length)return '';
     return `<div class="h">${esc(g.n)}</div><div class="list">${items.map(rows).join('')}</div>`;
   }).join('')}
   <p class="muted" style="margin-top:16px">Статистика обновляется по протоколам матчей${HB&&HB.updated?' · обновлено '+esc(HB.updated):''}.</p>`;
}
$('#tabs').innerHTML=[['rank','Рейтинг','📊'],['league','Лига','🏆'],['medals','Медали','🏅'],['me','Профиль','👤']]
  .map(([id,n,i])=>`<button class="tab" data-tab="${id}"><i>${i}</i>${n}</button>`).join('');
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-m],[data-pf],[data-p],[data-a],[data-tab],[data-role],[data-fav],[data-pred],#back');
  if(!t)return;const d=t.dataset;
  if(t.id==='back')return back();
  if(d.role){if(d.role===S.role)return;S.role=d.role;store.set('role',S.role);draw();scrollTo(0,0);return;}
  if('fav' in d){S.fav=d.fav||null;store.set('fav',S.fav);draw();scrollTo(0,0);return;}
  if(d.pred){
    if(S.preds[d.pred]===d.side)delete S.preds[d.pred]; else S.preds[d.pred]=d.side;
    store.set('preds',S.preds);
    const y=scrollY;draw();requestAnimationFrame(()=>scrollTo(0,y));return;}
  if(d.tab){if(d.tab===S.tab&&['rank','league','medals','me'].includes(S.view))return;
    S.sc[k()]=scrollY;S.tab=d.tab;S.view=d.tab==='rank'?'rank':d.tab==='league'?'league':d.tab==='medals'?'medals':'me';
    S.pid=(d.tab==='me'&&S.role==='player')?ME:null;draw();scrollTo(0,0);return;}
  if(d.m){if(d.m===S.metric)return;S.metric=d.m;
    document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.metric));
    $('#rl').innerHTML=rankList();return;}
  if(d.pf){if(d.pf===S.posf)return;S.posf=d.pf;
    const list=metricsFor(d.pf);
    if(!list.find(x=>x.id===S.metric))S.metric=list[0].id;
    document.querySelectorAll('[data-pf]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pf===S.posf));
    $('#mchips').innerHTML=list.map(x=>`<button class="chip" aria-pressed="${x.id===S.metric}" data-m="${x.id}">${x.n}</button>`).join('');
    $('#rl').innerHTML=rankList();return;}
  if(d.p)return go('player',{pid:d.p});
  if(d.a)return go('medal',{aid:d.a,pid:d.owner||S.pid||ME});
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#rl').innerHTML=rankList()}});
draw();
</script>
</body>
